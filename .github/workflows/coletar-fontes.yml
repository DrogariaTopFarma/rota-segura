# ============================================================================
# ROTA SEGURA — Agendamento da coleta de fontes públicas
# ----------------------------------------------------------------------------
# Só chama a Edge Function "coletar-fontes" de tempos em tempos — toda a
# lógica de verdade (RSS, filtro do RJ, IA, deduplicação, confiança) mora
# em supabase/functions/coletar-fontes/index.ts, não aqui. Este arquivo só
# aperta o botão na hora certa.
#
# COMO CONFIGURAR: veja COMO_CONFIGURAR_COLETA_RJ.md — resumindo, você
# precisa cadastrar 3 segredos deste repositório (Settings -> Secrets and
# variables -> Actions -> New repository secret):
#   SUPABASE_FUNCTION_URL  ex.: https://SEU-PROJETO.supabase.co/functions/v1/coletar-fontes
#   COLETA_SECRET           a MESMA senha que você configurou como secret
#                            da Edge Function (Dashboard do Supabase)
#   SUPABASE_SECRET_API_KEY a chave SECRETA (sb_secret_...) do seu projeto —
#                            Project Settings -> API Keys. Sensível de
#                            verdade (equivale à antiga service_role):
#                            NUNCA cole ela direto neste arquivo.
#
# INTERVALO: */30 * * * * = a cada 30 minutos. Pra mudar, edite a linha do
# "cron" abaixo (formato padrão do cron: minuto hora dia mês dia-da-semana).
# Intervalos menores gastam mais chamadas de IA por dia — veja a seção de
# custos/limites em COMO_CONFIGURAR_COLETA_RJ.md antes de deixar mais
# frequente.
# ============================================================================
name: Coletar fontes públicas (RJ)

on:
  schedule:
    - cron: '*/30 * * * *'
  # Permite disparar manualmente pela aba "Actions" do GitHub — use isso pra
  # testar sem esperar o horário do cron.
  workflow_dispatch: {}

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      # Usar "env:" (em vez de colar ${{ secrets.X }} direto dentro do
      # script) evita que um caractere especial no valor do secret quebre o
      # comando — o GitHub troca ${{ }} pelo texto ANTES de rodar o shell,
      # então um valor com aspas ou cifrão, por exemplo, podia virar um
      # comando bash inválido sem isso.
      - name: Diagnosticar os secrets (sem revelar o valor)
        env:
          URL_FUNCAO: ${{ secrets.SUPABASE_FUNCTION_URL }}
          SENHA: ${{ secrets.COLETA_SECRET }}
        run: |
          echo "SUPABASE_FUNCTION_URL tem ${#URL_FUNCAO} caracteres."
          if [ -n "$URL_FUNCAO" ]; then
            echo "Começa com: $(echo "$URL_FUNCAO" | cut -c1-8)"
            echo "Termina com: $(echo "$URL_FUNCAO" | rev | cut -c1-15 | rev)"
          else
            echo "Está VAZIO — o secret não existe ou o nome está diferente de SUPABASE_FUNCTION_URL."
          fi
          echo "COLETA_SECRET tem ${#SENHA} caracteres."

      - name: Chamar a Edge Function coletar-fontes
        env:
          URL_FUNCAO: ${{ secrets.SUPABASE_FUNCTION_URL }}
          SENHA: ${{ secrets.COLETA_SECRET }}
          # O "portão de entrada" (gateway) das Edge Functions deste projeto
          # confere apikey E authorization contra uma credencial de verdade
          # do Supabase (a chave SECRETA, sb_secret_...) antes mesmo de
          # chamar a função — por isso os dois cabeçalhos levam essa chave,
          # nunca a nossa própria senha (essa vai num cabeçalho à parte,
          # x-coleta-secret, que é o único que o código da função confere).
          CHAVE_SECRETA_SUPABASE: ${{ secrets.SUPABASE_SECRET_API_KEY }}
        run: |
          codigo=$(curl -s -o resposta.json -w "%{http_code}" \
            -X POST "$URL_FUNCAO" \
            -H "apikey: $CHAVE_SECRETA_SUPABASE" \
            -H "Authorization: Bearer $CHAVE_SECRETA_SUPABASE" \
            -H "x-coleta-secret: $SENHA" \
            -H "Content-Type: application/json")
          echo "Código HTTP: $codigo"
          echo "Resposta da função:"
          cat resposta.json
          if [ "$codigo" -ge 300 ]; then
            echo ""
            echo "A coleta falhou (HTTP $codigo). Confira os secrets deste repositório e os logs da Edge Function no Dashboard do Supabase (Edge Functions -> coletar-fontes -> Logs)."
            exit 1
          fi

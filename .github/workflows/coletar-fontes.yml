# ============================================================================
# ROTA SEGURA — Agendamento da coleta de fontes públicas
# ----------------------------------------------------------------------------
# Só chama a Edge Function "coletar-fontes" de tempos em tempos — toda a
# lógica de verdade (RSS, filtro do RJ, IA, deduplicação, confiança) mora
# em supabase/functions/coletar-fontes/index.ts, não aqui. Este arquivo só
# aperta o botão na hora certa.
#
# A URL da função fica FIXA aqui embaixo (não é secreta — é só o endereço;
# quem realmente protege a chamada são os dois secrets abaixo). Isso evita
# um problema real que já aconteceu: colar a URL errada/incompleta num
# secret do GitHub e não ter como conferir o valor depois (secrets não
# mostram o conteúdo salvo, só dá pra sobrescrever).
#
# COMO CONFIGURAR: veja COMO_CONFIGURAR_COLETA_RJ.md — resumindo, você
# precisa cadastrar 2 segredos deste repositório (Settings -> Secrets and
# variables -> Actions -> New repository secret):
#   COLETA_SECRET           a MESMA senha que você configurou como secret
#                            da Edge Function (Dashboard do Supabase)
#   SUPABASE_SECRET_API_KEY a chave SECRETA (sb_secret_...) do seu projeto —
#                            Project Settings -> API Keys. Sensível de
#                            verdade (equivale à antiga service_role):
#                            NUNCA cole ela direto neste arquivo.
#
# Se um dia trocar de projeto Supabase, troque a URL na linha "URL_FUNCAO:"
# abaixo.
#
# AGENDAMENTO: não é mais feito aqui. Conferindo os logs de verdade da Edge
# Function (aba "Invocations" no Dashboard do Supabase), o gatilho "schedule"
# do GitHub Actions chegou a ficar mais de 11h sem disparar nenhuma vez,
# mesmo configurado para */30 * * * * — isso é um limite conhecido e
# documentado do próprio GitHub (execuções agendadas atrasam ou são puladas
# em repositórios com pouca atividade), não um bug deste workflow. Quem
# aperta o botão agora é o pg_cron, dentro do próprio banco do Supabase
# (passo a passo na seção 8 de COMO_CONFIGURAR_COLETA_RJ.md), que chama a
# mesma URL abaixo direto de dentro do Postgres. Este workflow continua
# existindo só pra disparo manual (botão "Run workflow" na aba Actions),
# útil pra testar sem esperar o horário do cron.
# ============================================================================
name: Coletar fontes públicas (RJ)

on:
  # Permite disparar manualmente pela aba "Actions" do GitHub — use isso pra
  # testar sem esperar o horário do cron externo.
  workflow_dispatch: {}

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar a Edge Function coletar-fontes
        env:
          # Fixa de propósito (ver explicação no topo do arquivo) — não é
          # secreta, só o endereço da função.
          URL_FUNCAO: https://rmggyqqmhupkabgwmnzv.supabase.co/functions/v1/coletar-fontes
          SENHA: ${{ secrets.COLETA_SECRET }}
          # O "portão de entrada" (gateway) das Edge Functions deste projeto
          # confere apikey E authorization contra uma credencial de verdade
          # do Supabase (a chave SECRETA, sb_secret_...) antes mesmo de
          # chamar a função — por isso os dois cabeçalhos levam essa chave,
          # nunca a nossa própria senha (essa vai num cabeçalho à parte,
          # x-coleta-secret, que é o único que o código da função confere).
          CHAVE_SECRETA_SUPABASE: ${{ secrets.SUPABASE_SECRET_API_KEY }}
        run: |
          echo "COLETA_SECRET tem ${#SENHA} caracteres (0 = secret vazio ou com nome errado)."
          echo "SUPABASE_SECRET_API_KEY tem ${#CHAVE_SECRETA_SUPABASE} caracteres (0 = secret vazio ou com nome errado)."
          codigo=$(curl -s -o resposta.json -w "%{http_code}" \
            -X POST "$URL_FUNCAO" \
            -H "apikey: $CHAVE_SECRETA_SUPABASE" \
            -H "Authorization: Bearer $CHAVE_SECRETA_SUPABASE" \
            -H "x-coleta-secret: $SENHA" \
            -H "Content-Type: application/json")
          echo "Código HTTP: $codigo"
          echo "Resposta da função:"
          cat resposta.json
          if [ "$codigo" -ge 300 ]; then
            echo ""
            echo "A coleta falhou (HTTP $codigo). Confira os secrets deste repositório e os logs da Edge Function no Dashboard do Supabase (Edge Functions -> coletar-fontes -> Logs)."
            exit 1
          fi

<body class="auth-body">
  <main class="auth-caixa boas-vindas">

      <span class="auth-marca__nome">Rota Segura</span>
      <span class="auth-marca__slogan">Sua segurança. Sua rota.</span>
    </div>

    <h1>Caminhe sabendo o que tem pela frente</h1>
    <p>Relatos, pontos de apoio e delegacias no mapa, registrados por quem faz o mesmo caminho que você.</p>

    <a class="btn btn-primario btn-bloco" href="pages/login.html">Entrar</a>
    <a class="btn btn-secundario btn-bloco" href="pages/cadastro.html">Criar conta</a>
  </main>

  <script type="module">
    import { aplicarIcones } from './js/icons.js';
    import { redirecionarSeLogado } from './js/auth.js';
    import { registrarServiceWorker } from './js/pwa.js';
    aplicarIcones();
    registrarServiceWorker('sw.js');
    redirecionarSeLogado('pages/mapa.html');

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#E83D67">
  <title>Criar conta — Rota Segura</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="auth-body">
  <main class="auth-caixa">
    <div class="auth-marca">
      <div class="auth-marca__escudo" data-icone="escudo" data-tamanho="34" aria-hidden="true"></div>
      <span class="auth-marca__nome">Rota Segura</span>
      <span class="auth-marca__slogan">Sua segurança. Sua rota.</span>
    </div>

    <h1 class="auth-titulo">Criar conta</h1>
    <p class="auth-subtitulo">Leva menos de um minuto.</p>

    <div id="mensagem" class="mensagem" hidden></div>

    <form id="form-cadastro" novalidate>
      <div class="campo">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" autocomplete="name"
               placeholder="Como podemos te chamar" required aria-describedby="erro-nome">
        <span class="campo-erro" id="erro-nome" hidden></span>
      </div>

      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" autocomplete="email"
               placeholder="voce@exemplo.com" required aria-describedby="erro-email">
        <span class="campo-erro" id="erro-email" hidden></span>
      </div>

      <div class="campo">
        <label for="telefone">Telefone <span class="texto-secundario">(opcional)</span></label>
        <input type="tel" id="telefone" name="telefone" autocomplete="tel" placeholder="(21) 90000-0000">
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <div class="senha-wrapper">
          <input type="password" id="senha" name="senha" autocomplete="new-password"
                 placeholder="Mínimo de 6 caracteres" required aria-describedby="erro-senha">
          <button type="button" class="senha-toggle" data-alvo="senha"
                  data-icone="olho" data-tamanho="20" aria-label="Mostrar senha"></button>
        </div>
        <span class="campo-erro" id="erro-senha" hidden></span>
      </div>

      <div class="campo">
        <label for="confirmar">Confirmar senha</label>
        <div class="senha-wrapper">
          <input type="password" id="confirmar" name="confirmar" autocomplete="new-password"
                 placeholder="Repita a senha" required aria-describedby="erro-confirmar">
          <button type="button" class="senha-toggle" data-alvo="confirmar"
                  data-icone="olho" data-tamanho="20" aria-label="Mostrar senha"></button>
        </div>
        <span class="campo-erro" id="erro-confirmar" hidden></span>
      </div>

      <label class="campo-checkbox">
        <input type="checkbox" id="termos" name="termos">
        <span>Li e aceito os termos de uso da plataforma.</span>
      </label>

      <label class="campo-checkbox">
        <input type="checkbox" id="privacidade" name="privacidade">
        <span>Li e aceito a política de privacidade e o tratamento dos meus dados.</span>
      </label>

      <button type="submit" class="btn btn-primario btn-bloco">CRIAR CONTA</button>
    </form>

    <p class="auth-rodape">Já tem conta? <a href="login.html">Entrar</a></p>
  </main>

  <script type="module">
    import { aplicarIcones } from '../js/icons.js';
    import { iniciarAuth, redirecionarSeLogado } from '../js/auth.js';
    aplicarIcones();
    redirecionarSeLogado('mapa.html');
    iniciarAuth();
  </script>
</body>
</html>

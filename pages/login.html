<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#E83D67">
  <title>Entrar — Rota Segura</title>
  <link rel="manifest" href="../manifest.json">
  <link rel="apple-touch-icon" href="../assets/icone-192.png">
  <link rel="icon" type="image/png" href="../assets/icone-192.png">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://drogariatopfarma.github.io/rota-segura/pages/login.html">
  <meta property="og:title" content="Entrar — Rota Segura">
  <meta property="og:description" content="Plataforma colaborativa de segurança para mulheres em deslocamentos urbanos.">
  <meta property="og:image" content="https://drogariatopfarma.github.io/rota-segura/assets/icone-512.png">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="auth-body">
  <main class="auth-caixa">
    <div class="auth-marca">
      <div class="auth-marca__escudo" data-icone="escudo" data-tamanho="34" aria-hidden="true"></div>
      <span class="auth-marca__nome">Rota Segura</span>
      <span class="auth-marca__slogan">Sua segurança. Sua rota.</span>
    </div>

    <h1 class="auth-titulo">Entrar</h1>
    <p class="auth-subtitulo">Use o e-mail e a senha da sua conta.</p>

    <div id="mensagem" class="mensagem" hidden></div>

    <form id="form-login" novalidate>
      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" autocomplete="email"
               placeholder="voce@exemplo.com" required aria-describedby="erro-email">
        <span class="campo-erro" id="erro-email" hidden></span>
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <div class="senha-wrapper">
          <input type="password" id="senha" name="senha" autocomplete="current-password"
                 placeholder="Sua senha" required aria-describedby="erro-senha">
          <button type="button" class="senha-toggle" data-alvo="senha"
                  data-icone="olho" data-tamanho="20" aria-label="Mostrar senha"></button>
        </div>
        <span class="campo-erro" id="erro-senha" hidden></span>
      </div>

      <button type="submit" class="btn btn-primario btn-bloco">ENTRAR</button>

      <div class="auth-links">
        <a href="recuperar-senha.html">Esqueci minha senha</a>
        <a href="cadastro.html">Criar conta</a>
      </div>
    </form>

    <p class="auth-rodape"><a href="../index.html">Voltar ao início</a></p>
  </main>

  <script type="module">
    import { aplicarIcones } from '../js/icons.js';
    import { iniciarAuth, redirecionarSeLogado } from '../js/auth.js';
    aplicarIcones();
    redirecionarSeLogado('mapa.html');
    iniciarAuth();
  </script>
</body>
</html>

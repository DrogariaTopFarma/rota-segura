<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#E83D67">
  <title>Nova senha — Rota Segura</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="auth-body">
  <main class="auth-caixa">
    <div class="auth-marca">
      <div class="auth-marca__escudo" data-icone="cadeado" data-tamanho="34" aria-hidden="true"></div>
      <span class="auth-marca__nome">Rota Segura</span>
    </div>

    <h1 class="auth-titulo">Criar nova senha</h1>
    <p class="auth-subtitulo">Escolha uma senha nova para sua conta.</p>

    <div id="mensagem" class="mensagem" hidden></div>

    <form id="form-nova-senha" novalidate>
      <div class="campo">
        <label for="senha">Nova senha</label>
        <div class="senha-wrapper">
          <input type="password" id="senha" name="senha" autocomplete="new-password"
                 placeholder="Mínimo de 6 caracteres" required aria-describedby="erro-senha">
          <button type="button" class="senha-toggle" data-alvo="senha"
                  data-icone="olho" data-tamanho="20" aria-label="Mostrar senha"></button>
        </div>
        <span class="campo-erro" id="erro-senha" hidden></span>
      </div>

      <div class="campo">
        <label for="confirmar">Confirmar nova senha</label>
        <div class="senha-wrapper">
          <input type="password" id="confirmar" name="confirmar" autocomplete="new-password"
                 placeholder="Repita a senha" required aria-describedby="erro-confirmar">
          <button type="button" class="senha-toggle" data-alvo="confirmar"
                  data-icone="olho" data-tamanho="20" aria-label="Mostrar senha"></button>
        </div>
        <span class="campo-erro" id="erro-confirmar" hidden></span>
      </div>

      <button type="submit" class="btn btn-primario btn-bloco">SALVAR NOVA SENHA</button>
    </form>

    <p class="auth-rodape"><a href="login.html">Voltar ao login</a></p>
  </main>

  <script type="module">
    import { aplicarIcones } from '../js/icons.js';
    import { iniciarAuth } from '../js/auth.js';
    aplicarIcones();
    iniciarAuth();
  </script>
</body>
</html>
